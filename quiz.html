<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>宠物性格测试 - 问卷</title>
  <style>
    :root { --border:#e9e9e9; --muted:#666; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC","Microsoft YaHei", sans-serif; }
    .wrap { max-width: 860px; margin: 40px auto; padding: 0 16px; }
    .card { border: 1px solid var(--border); border-radius: 18px; padding: 16px; background: #fff; }
    h1 { margin: 0 0 10px; }
    .muted { color: var(--muted); margin: 0 0 18px; line-height: 1.6; }
    .q { margin: 0 0 18px; }
    .q h3 { margin: 0 0 10px; font-size: 16px; line-height: 1.5; }
    .opt { display: block; padding: 10px 12px; border: 1px solid var(--border); border-radius: 14px; margin: 8px 0; cursor: pointer; }
    .opt:hover { background: #fafafa; }
    .opt input { margin-right: 10px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap: 12px; margin: 18px 0; }
    .progress { flex:1; height: 10px; background: #f2f2f2; border-radius: 999px; overflow:hidden; }
    .progress > div { height: 100%; width: 0%; background: #111; }
    .count { color: var(--muted); font-size: 13px; min-width: 84px; text-align: right; }
    button { padding: 14px 18px; border: 0; border-radius: 14px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { margin: 10px 0 0; color: var(--muted); }
    .sticky { position: sticky; top: 0; padding: 12px 0; background: rgba(255,255,255,.9); backdrop-filter: blur(6px); border-bottom: 1px solid #f3f3f3; z-index: 10; }
    .pill { display:inline-block; padding: 6px 10px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--muted); }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="sticky">
      <div class="topbar">
        <div class="pill">24 题 · 自动出结果</div>
        <div class="progress" aria-label="progress"><div id="bar"></div></div>
        <div class="count" id="count">0/24</div>
      </div>
    </div>

    <h1>宠物性格测试</h1>
    <p class="muted">
      请根据你家宠物的“常态”作答。全部完成后点击提交，我们会计算 E/A/O/N/C 维度并输出对应的 9 型结果。
    </p>

    <form id="quizForm" class="card"></form>

    <div style="margin-top:14px;">
      <button id="submitBtn" type="button">提交并查看结果</button>
      <p id="status"></p>
    </div>
  </div>

  <script>
    // ✅ 把这里替换成你部署后的 Google Apps Script Web App URL
    const GAS_WEBAPP_URL = "PASTE_YOUR_GAS_WEB_APP_URL_HERE";

    // 题库：每个选项用 score: {E,A,O,N,C}
    const QUESTIONS = [
      {
        id: "q1",
        title: "Q1 在熟悉的环境里，它平时更接近哪种状态？",
        options: [
          { label: "A. 经常主动走动、自己找事情", score: {E:2,A:0,O:1,N:0,C:0} },
          { label: "B. 有活动，但多在固定范围",     score: {E:1,A:0,O:0,N:0,C:1} },
          { label: "C. 安静待着，留意周围",         score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "D. 多半跟着你行动",             score: {E:0,A:2,O:0,N:0,C:1} },
        ]
      },
      {
        id: "q2",
        title: "Q2 日常生活中，它的注意力更多放在？",
        options: [
          { label: "A. 自己正在做的事情",           score: {E:2,A:0,O:0,N:0,C:0} },
          { label: "B. 周围的动静和变化",           score: {E:0,A:0,O:1,N:1,C:0} },
          { label: "C. 你的举动和状态",             score: {E:0,A:2,O:0,N:0,C:0} },
          { label: "D. 熟悉的位置或物品",           score: {E:0,A:0,O:0,N:0,C:2} },
        ]
      },
      {
        id: "q3",
        title: "Q3 当日常作息被打乱时，它通常会？",
        options: [
          { label: "A. 很快适应，照样活动",         score: {E:2,A:0,O:0,N:0,C:0} },
          { label: "B. 明显变得烦躁或不安",         score: {E:0,A:0,O:0,N:2,C:0} },
          { label: "C. 行动减少，变得安静",         score: {E:0,A:0,O:0,N:1,C:1} },
          { label: "D. 更依赖固定的位置或习惯",     score: {E:0,A:0,O:0,N:0,C:2} },
        ]
      },
      {
        id: "q4",
        title: "Q4 在需要做选择时，它更像？",
        options: [
          { label: "A. 先行动，再调整",             score: {E:2,A:0,O:1,N:0,C:0} },
          { label: "B. 看清楚再决定",               score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "C. 等你给出信号",               score: {E:0,A:2,O:0,N:0,C:1} },
          { label: "D. 尽量保持不变",               score: {E:0,A:0,O:0,N:0,C:2} },
        ]
      },
      {
        id: "q5",
        title: "Q5 当你不在身边时，它更常见的状态是？",
        options: [
          { label: "A. 自己活动",                   score: {E:2,A:0,O:0,N:0,C:0} },
          { label: "B. 安静待着",                   score: {E:0,A:0,O:0,N:0,C:1} },
          { label: "C. 留意门口或声音",             score: {E:0,A:0,O:1,N:0,C:0} },
          { label: "D. 表现出不安",                 score: {E:0,A:0,O:0,N:2,C:0} },
        ]
      },
      {
        id: "q6",
        title: "Q6 面对新情况时，它更倾向于？",
        options: [
          { label: "A. 自己去尝试",                 score: {E:2,A:0,O:2,N:0,C:0} },
          { label: "B. 先观察再靠近",               score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "C. 等你带着",                   score: {E:0,A:2,O:0,N:0,C:1} },
          { label: "D. 能避就避",                   score: {E:0,A:0,O:0,N:2,C:0} },
        ]
      },
      {
        id: "q7",
        title: "Q7 整体来看，它是否有“自己的一套做法”？",
        options: [
          { label: "A. 非常明显",                   score: {E:1,A:0,O:1,N:0,C:0} },
          { label: "B. 有，但不执着",               score: {E:0,A:0,O:0,N:0,C:1} },
          { label: "C. 多数听你安排",               score: {E:0,A:2,O:0,N:0,C:1} },
          { label: "D. 很少，坚持性不强",           score: {E:0,A:0,O:0,N:1,C:0} },
        ]
      },
      {
        id: "q8",
        title: "Q8 大多数时候，它对变化的态度是？",
        options: [
          { label: "A. 变化会让它更兴奋",           score: {E:1,A:0,O:2,N:0,C:0} },
          { label: "B. 能接受，但需要时间",         score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "C. 容易紧张",                   score: {E:0,A:0,O:0,N:2,C:0} },
          { label: "D. 更希望保持原样",             score: {E:0,A:0,O:0,N:0,C:2} },
        ]
      },
      {
        id: "q9",
        title: "Q9 平时它的行动节奏更像？",
        options: [
          { label: "A. 快而主动",                   score: {E:2,A:0,O:1,N:0,C:0} },
          { label: "B. 稳定",                       score: {E:0,A:0,O:0,N:0,C:1} },
          { label: "C. 慢而谨慎",                   score: {E:0,A:0,O:0,N:1,C:1} },
          { label: "D. 跟随你的节奏",               score: {E:0,A:2,O:0,N:0,C:0} },
        ]
      },
      {
        id: "q10",
        title: "Q10 在陌生环境中，它通常？",
        options: [
          { label: "A. 更活跃",                     score: {E:2,A:0,O:1,N:0,C:0} },
          { label: "B. 谨慎行动",                   score: {E:0,A:0,O:1,N:1,C:0} },
          { label: "C. 观察为主",                   score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "D. 靠近你",                     score: {E:0,A:2,O:0,N:0,C:1} },
        ]
      },
      {
        id: "q11",
        title: "Q11 小变化对它情绪的影响程度是？",
        options: [
          { label: "A. 几乎不受影响",               score: {E:0,A:0,O:0,N:0,C:1} },
          { label: "B. 偶尔会",                     score: {E:0,A:0,O:0,N:1,C:0} },
          { label: "C. 比较明显",                   score: {E:0,A:0,O:0,N:2,C:0} },
          { label: "D. 非常依赖你的安抚",           score: {E:0,A:1,O:0,N:1,C:0} },
        ]
      },
      {
        id: "q12",
        title: "Q12 整体来看，它更看重？",
        options: [
          { label: "A. 自由活动",                   score: {E:2,A:0,O:0,N:0,C:0} },
          { label: "B. 新鲜探索",                   score: {E:0,A:0,O:2,N:0,C:0} },
          { label: "C. 稳定安全",                   score: {E:0,A:0,O:0,N:0,C:2} },
          { label: "D. 陪伴关系",                   score: {E:0,A:2,O:0,N:0,C:0} },
        ]
      },
      {
        id: "q13",
        title: "Q13 在没有明确指令时，它更常？",
        options: [
          { label: "A. 自己找事做",                 score: {E:2,A:0,O:0,N:0,C:0} },
          { label: "B. 待在熟悉的位置",             score: {E:0,A:0,O:0,N:0,C:1} },
          { label: "C. 观察周围",                   score: {E:0,A:0,O:1,N:0,C:0} },
          { label: "D. 靠近你等待",                 score: {E:0,A:0,O:0,N:2,C:0} },
        ]
      },
      {
        id: "q14",
        title: "Q14 在重复的日常中，它通常？",
        options: [
          { label: "A. 自己找变化",                 score: {E:1,A:0,O:2,N:0,C:0} },
          { label: "B. 习惯并接受",                 score: {E:0,A:0,O:0,N:0,C:1} },
          { label: "C. 显得有些无聊",               score: {E:0,A:0,O:0,N:1,C:0} },
          { label: "D. 更需要你的互动",             score: {E:0,A:2,O:0,N:0,C:0} },
        ]
      },
      {
        id: "q15",
        title: "Q15 当周围同时发生很多事情时，它更可能？",
        options: [
          { label: "A. 更活跃",                     score: {E:2,A:0,O:1,N:0,C:0} },
          { label: "B. 专注观察一处",               score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "C. 明显不安",                   score: {E:0,A:0,O:0,N:2,C:0} },
          { label: "D. 靠近熟悉的人或物",           score: {E:0,A:1,O:0,N:0,C:1} },
        ]
      },
      {
        id: "q16",
        title: "Q16 面对不确定情况时，它更依赖？",
        options: [
          { label: "A. 自己的尝试",                 score: {E:2,A:0,O:1,N:0,C:0} },
          { label: "B. 观察反馈",                   score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "C. 你的反应",                   score: {E:0,A:2,O:0,N:0,C:0} },
          { label: "D. 熟悉规则",                   score: {E:0,A:0,O:0,N:0,C:2} },
        ]
      },
      {
        id: "q17",
        title: "Q17 面对限制或规则时，它通常？",
        options: [
          { label: "A. 尝试突破",                   score: {E:2,A:0,O:1,N:0,C:0} },
          { label: "B. 先理解规则",                 score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "C. 接受并遵守",                 score: {E:0,A:0,O:0,N:0,C:2} },
          { label: "D. 表现出紧张",                 score: {E:0,A:0,O:0,N:2,C:0} },
        ]
      },
      {
        id: "q18",
        title: "Q18 遇到障碍或困难时，它更可能？",
        options: [
          { label: "A. 尝试不同方法",               score: {E:2,A:0,O:2,N:0,C:0} },
          { label: "B. 停下来观察",                 score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "C. 等你处理",                   score: {E:0,A:2,O:0,N:0,C:1} },
          { label: "D. 放弃或回避",                 score: {E:0,A:0,O:0,N:2,C:0} },
        ]
      },
      {
        id: "q19",
        title: "Q19 平时它更容易被什么吸引？",
        options: [
          { label: "A. 可以行动的事情",             score: {E:2,A:0,O:0,N:0,C:0} },
          { label: "B. 新鲜的信息",                 score: {E:0,A:0,O:2,N:0,C:0} },
          { label: "C. 安全稳定的事物",             score: {E:0,A:0,O:0,N:0,C:2} },
          { label: "D. 与你的互动",                 score: {E:0,A:2,O:0,N:0,C:0} },
        ]
      },
      {
        id: "q20",
        title: "Q20 在多宠或人多的环境中，它更像？",
        options: [
          { label: "A. 更活跃",                     score: {E:2,A:0,O:0,N:0,C:0} },
          { label: "B. 观察为主",                   score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "C. 偏安静",                     score: {E:0,A:0,O:0,N:0,C:1} },
          { label: "D. 明显紧张",                   score: {E:0,A:0,O:0,N:2,C:0} },
        ]
      },
      {
        id: "q21",
        title: "Q21 多数时候，它的节奏是？",
        options: [
          { label: "A. 主动带头",                   score: {E:2,A:0,O:0,N:0,C:0} },
          { label: "B. 稳定推进",                   score: {E:0,A:0,O:0,N:0,C:1} },
          { label: "C. 谨慎慢行",                   score: {E:0,A:0,O:0,N:1,C:1} },
          { label: "D. 跟随你",                     score: {E:0,A:2,O:0,N:0,C:0} },
        ]
      },
      {
        id: "q22",
        title: "Q22 面对新路线或新地方，它更可能？",
        options: [
          { label: "A. 主动探索",                   score: {E:1,A:0,O:2,N:0,C:0} },
          { label: "B. 边走边看",                   score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "C. 偏向原路线",                 score: {E:0,A:0,O:0,N:0,C:2} },
          { label: "D. 显得紧张",                   score: {E:0,A:0,O:0,N:2,C:0} },
        ]
      },
      {
        id: "q23",
        title: "Q23 当你情绪变化时，它通常？",
        options: [
          { label: "A. 不太受影响",                 score: {E:0,A:0,O:0,N:0,C:0} },
          { label: "B. 留意你的状态",               score: {E:0,A:0,O:1,N:0,C:0} },
          { label: "C. 明显靠近你",                 score: {E:0,A:2,O:0,N:0,C:0} },
          { label: "D. 自己变得不安",               score: {E:0,A:0,O:0,N:2,C:0} },
        ]
      },
      {
        id: "q24",
        title: "Q24 综合来看，它更像哪一类？",
        options: [
          { label: "A. 行动导向",                   score: {E:2,A:0,O:0,N:0,C:0} },
          { label: "B. 思考观察",                   score: {E:0,A:0,O:1,N:0,C:1} },
          { label: "C. 稳定保守",                   score: {E:0,A:0,O:0,N:0,C:2} },
          { label: "D. 情绪敏感",                   score: {E:0,A:0,O:0,N:2,C:0} },
        ]
      },
    ];

    // 渲染题目到页面
    const formEl = document.getElementById("quizForm");
    QUESTIONS.forEach((q, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "q";
      wrap.innerHTML = `<h3>${q.title}</h3>`;

      q.options.forEach((opt, j) => {
        const id = `${q.id}_${j}`;
        const label = document.createElement("label");
        label.className = "opt";
        label.setAttribute("for", id);

        const input = document.createElement("input");
        input.type = "radio";
        input.name = q.id;
        input.id = id;
        input.required = true;
        input.value = JSON.stringify(opt.score); // 直接把 score 编进 value

        label.appendChild(input);
        label.appendChild(document.createTextNode(opt.label));
        wrap.appendChild(label);

        input.addEventListener("change", updateProgress);
      });

      formEl.appendChild(wrap);
      if (idx !== QUESTIONS.length - 1) {
        const hr = document.createElement("div");
        hr.style.height = "1px";
        hr.style.background = "#f3f3f3";
        hr.style.margin = "18px 0";
        formEl.appendChild(hr);
      }
    });

    function updateProgress() {
      const answered = QUESTIONS.filter(q => {
        return !!document.querySelector(`input[name="${q.id}"]:checked`);
      }).length;

      const pct = Math.round((answered / QUESTIONS.length) * 100);
      document.getElementById("bar").style.width = pct + "%";
      document.getElementById("count").textContent = `${answered}/${QUESTIONS.length}`;
    }
    updateProgress();

    // 提交：计算 E/A/O/N/C 总分 → 发给 GAS → 跳转
    const btn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");

    btn.addEventListener("click", async () => {
      if (!GAS_WEBAPP_URL || GAS_WEBAPP_URL.includes("PASTE_YOUR_GAS_WEB_APP_URL_HERE")) {
        alert("请先在 quiz.html 里填写 GAS_WEBAPP_URL（Google Apps Script Web App URL）");
        return;
      }

      // 检查是否全答完
      for (const q of QUESTIONS) {
        const picked = document.querySelector(`input[name="${q.id}"]:checked`);
        if (!picked) {
          alert(`你还没回答：${q.title}`);
          return;
        }
      }

      btn.disabled = true;
      statusEl.textContent = "计算中…";

      const totals = { E:0, A:0, O:0, N:0, C:0 };
      const answers = {};

      for (const q of QUESTIONS) {
        const picked = document.querySelector(`input[name="${q.id}"]:checked`);
        const score = JSON.parse(picked.value);
        answers[q.id] = score;
        totals.E += score.E || 0;
        totals.A += score.A || 0;
        totals.O += score.O || 0;
        totals.N += score.N || 0;
        totals.C += score.C || 0;
      }

      try {
        const resp = await fetch(GAS_WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            totals,     // 总分
            answers,    // 每题选项得分（方便你在 GAS 里做更复杂逻辑）
            meta: { ts: Date.now(), ua: navigator.userAgent }
          })
        });

        if (!resp.ok) throw new Error("网络错误：" + resp.status);
        const data = await resp.json();
        if (!data.redirect) throw new Error("返回缺少 redirect 字段");

        statusEl.textContent = "完成！正在跳转…";
        window.location.href = data.redirect;

      } catch (err) {
        console.error(err);
        statusEl.textContent = "提交失败：" + (err?.message || err);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
